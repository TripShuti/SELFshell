# ============================================================
# .github/workflows/ci.yml — валідація конфігів репозиторію
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax (install.sh, CLI, scripts)
        run: |
          for f in install.sh quickshell/scripts/selfshell quickshell/scripts/update-palette.sh quickshell/scripts/pacman_upgrade.sh quickshell/scripts/update-wallpaper-only.sh tests/install_test.sh tests/fake_upower.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: QML logic regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs
          node tests/qml_regressions.js

      - name: Python syntax
        run: |
          python3 -m py_compile \
            quickshell/scripts/update-palette.py \
            quickshell/scripts/tracklist.py \
            quickshell/scripts/genshin_stats.py \
            quickshell/scripts/pacman_updates.py \
            quickshell/scripts/sysinfo.py \
            quickshell/scripts/update_config.py \
            quickshell/scripts/config_ctl.py \
            quickshell/scripts/sleep_guard.py
          echo "ok: python scripts"

      - name: JSON validity
        run: |
          python3 - <<'EOF'
          import json
          for f in [
              "quickshell/data/config.json",
              "quickshell/data/palette.json",
              "hypr/env.json",
          ]:
              json.load(open(f))
              print(f"ok: {f}")
          EOF

      - name: TOML validity (yazi, starship)
        run: |
          python3 - <<'EOF'
          import tomllib
          for f in [
              "yazi/yazi.toml",
              "yazi/keymap.toml",
              "yazi/theme.toml",
              "yazi/package.toml",
              "starship/config.toml",
          ]:
              tomllib.load(open(f, "rb"))
              print(f"ok: {f}")
          EOF

      - name: fastfetch config.jsonc validity
        run: |
          python3 - <<'EOF'
          import json, re
          src = open("fastfetch/config.jsonc").read()
          src = re.sub(r"//.*", "", src)
          src = re.sub(r"/\*.*?\*/", "", src, flags=re.S)
          json.loads(src)
          print("ok: fastfetch/config.jsonc")
          EOF

      - name: Lua syntax (hypr configs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 luajit
          for f in hypr/hyprland.lua hypr/modules/*.lua; do
            lua5.4 -e "assert(loadfile('$f'))"
            echo "ok: $f"
          done
          luajit tests/lua/json_test.lua "$PWD"
          luajit tests/lua/env_rules_test.lua "$PWD"
          luajit tests/lua/binds_test.lua "$PWD"
          luajit tests/lua/visual_test.lua "$PWD"

      - name: Fish syntax
        run: |
          sudo apt-get install -y -qq fish
          fish -n fish/config.fish fish/conf.d/*.fish

      - name: Fake upower fixture (BatteryWidget contract)
        run: |
          export FAKE_BATTERY_PCT=12 FAKE_BATTERY_STATE=discharging
          [ "$(bash tests/fake_upower.sh -e)" = "/org/freedesktop/UPower/devices/battery_BAT0" ] || exit 1
          out="$(bash tests/fake_upower.sh -i)"
          echo "$out" | grep -qE "^[[:space:]]*state[[:space:]]*:[[:space:]]*discharging[[:space:]]*$" || exit 1
          line="$(echo "$out" | grep -E "^[[:space:]]*percentage" | head -1)"
          python3 -c "import re,sys; m=re.match(r\"^\s*percentage\s*:\s*(\d+)%\", sys.argv[1]); assert m and int(m.group(1)) == 12, sys.argv[1]" "$line" || exit 1
          export FAKE_BATTERY_STATE=charging
          bash tests/fake_upower.sh -i | grep -q "state:[[:space:]]*charging" || exit 1

      - name: Python unit tests (genshin_stats, update-palette, sysinfo, pacman, tracklist)
        run: |
          sudo apt-get install -y -qq python3-requests python3-dotenv
          python3 -m unittest discover -s tests/python

      - name: Config schema validation (config.json, env.json)
        run: |
          python3 tests/check_config_schema.py
          python3 tests/check_md_links.py

      - name: Banner check (quickshell)
        run: python3 tests/check_banner.py

      - name: Canonical repo URL casing
        run: |
          ! grep -rn "TripShuti/[s]elfshell" . --exclude-dir=.git --exclude-dir=__pycache__ 2>/dev/null

      - name: Installer logic tests (helpers, rollback, prompts)
        run: |
          bash tests/install_test.sh

      - name: Shellcheck
        run: |
          command -v shellcheck || sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh quickshell/scripts/selfshell quickshell/scripts/update-palette.sh quickshell/scripts/pacman_upgrade.sh quickshell/scripts/update-wallpaper-only.sh

      - name: VERSION is valid SemVer
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' quickshell/VERSION
          echo "ok: quickshell/VERSION ($(cat quickshell/VERSION))"

      - name: Fallback wallpaper tracked
        run: |
          test -f quickshell/wp/wp1.jpg
          echo "ok: fallback wallpaper"

  qml-compile:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install QML runtime and headless compositor
        run: pacman -Syu --needed --noconfirm git python quickshell qt6-5compat weston
      - uses: actions/checkout@v5
      - name: Compile every QML component
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-ci
          weston --backend=headless --renderer=pixman --socket=wayland-ci --idle-time=0 --no-config --log="$XDG_RUNTIME_DIR/weston.log" &
          compositor_pid=$!
          trap 'kill "$compositor_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            test ! -S "$XDG_RUNTIME_DIR/wayland-ci" || break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-ci" || { cat "$XDG_RUNTIME_DIR/weston.log"; exit 1; }
          python3 quickshell/scripts/update_config.py check quickshell
          python3 tests/qml_smoke.py
